<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - ADEL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/styles2.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/navbar.css">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="../assets/imagenes/imagen2.png" alt="Logo ADEL" height="80" class="me-2">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="./index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="./inicio.html">Iniciar Sesión</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="main">
    <section class="login-card">
      <h1>Crea tu cuenta en ADEL</h1>
      <form id="registroForm" class="form">
        <input type="text" id="nombre" placeholder="Nombre" required />
        <input type="email" id="correo" placeholder="Correo electrónico" required />
        <input type="password" id="contraseña" placeholder="Contraseña" required />
        <button type="submit" class="btn">Registrarme</button>
      </form>
      <div class="links">
        <p>¿Ya tienes cuenta? <a href="./inicio.html" class="register"><em>Inicia sesión</em></a></p>
      </div>
    </section>
  </main>

<script src="./assets/main.js"></script>

</body>
</html>
