<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil de Usuario - ADEL</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap y estilos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/navbar.css">
  <link rel="stylesheet" href="./assets/styles3.css">

  <!-- espacio para el navbar fixed-top -->
  <style>
    body {
      margin: 0;
      padding-top: 100px; /* altura aproximada del navbar */
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
</head>

<body>
  <!-- NAVBAR unificado -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="./index.html">
        <img src="./assets/imagenes/imagen2.png" alt="Logo ADEL" height="80" class="me-2">
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav" id="navList">
          <!-- elementos públicos -->
          <li class="nav-item" id="navInicio"><a class="nav-link" href="./index.html">Inicio</a></li>
          <li class="nav-item" id="navNoticias"><a class="nav-link" href="./noticias.html">Noticias</a></li>
          <li class="nav-item" id="navMapa"><a class="nav-link" href="./mapa.html">Mapa</a></li>
          <li class="nav-item" id="navRuta"><a class="nav-link" href="./ruta.html">Ruta</a></li>

          <!-- login / registro (visibles si NO hay sesión) -->
          <li class="nav-item" id="navLogin"><a class="nav-link" href="./inicio.html">Iniciar Sesión</a></li>
          <li class="nav-item" id="navRegister"><a class="nav-link" href="./registro.html">Registrarse</a></li>

          <!-- perfil / logout (visibles si HAY sesión) -->
          <li class="nav-item dropdown d-none" id="navUserDropdown">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdownLink" role="button"
               data-bs-toggle="dropdown" aria-expanded="false">
              <span id="navUserName">Usuario</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdownLink">
              <li><a class="dropdown-item" id="navPerfil" href="./perfil.html">Perfil</a></li>
              <li><a class="dropdown-item" id="navCerrar" href="#" role="button">Cerrar sesión</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO PERFIL -->
  <main class="main">
    <section class="profile-card">
      <div class="profile-section">
        <h2>Perfil de Usuario</h2>
        <div class="profile-avatar">
          <img src="./assets/imagenes/perfil.png" alt="Avatar de usuario">
        </div>

        <!-- FORMULARIO DE PERFIL -->
        <form class="form form-profile" id="formPerfil">
          <input type="text" id="nombreUsuario" placeholder="Nombre" value="">
          <input type="email" id="correoUsuario" placeholder="Correo electrónico" value="">
          <button type="submit" class="btn">Actualizar datos</button>
        </form>
      </div>

      <div class="business-section">
        <h2>Información del Negocio</h2>

        <!-- FORMULARIO DEL NEGOCIO -->
        <form class="form form-business" id="formNegocio">
          <input type="text" id="nombreNegocio" placeholder="Nombre del negocio">
          <input type="text" id="sectorNegocio" placeholder="Sector">
          <input type="number" id="costoPromedio" placeholder="Costo promedio por producto (COP)">
          <input type="number" id="precioVenta" placeholder="Precio de venta promedio (COP)">
          <select id="canalVenta">
            <option selected disabled>Canal de venta</option>
            <option>Presencial</option>
            <option>En línea</option>
            <option>Mixto</option>
          </select>
          <textarea id="descripcionNegocio" rows="3" placeholder="Descripción adicional"></textarea>
        </form>
      </div>
    </section>
  </main>

  <!-- JS -->
  <script src="./assets/nav.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/main.js"></script>
</body>
</html>
