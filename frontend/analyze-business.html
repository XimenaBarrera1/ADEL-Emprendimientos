<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analizar negocio - ADEL</title>

  <!-- Fuentes y Bootstrap -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS local -->
  <link rel="stylesheet" href="./assets/navbar.css">
  <link rel="stylesheet" href="./assets/styles2.css">

  <!-- espacio para el navbar fixed-top -->
  <style>
    body {
      margin: 0;
      padding-top: 100px; /* altura aprox del navbar */
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
</head>

<body>
  <!-- NAVBAR unificado -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="./index.html">
        <img src="./assets/imagenes/imagen2.png" alt="Logo ADEL" height="80" class="me-2">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav" id="navList">
          <!-- elementos públicos -->
          <li class="nav-item" id="navInicio"><a class="nav-link" href="./index.html">Inicio</a></li>
          <li class="nav-item" id="navNoticias"><a class="nav-link" href="./noticias.html">Noticias</a></li>
          <li class="nav-item" id="navMapa"><a class="nav-link" href="./mapa.html">Mapa</a></li>
          <li class="nav-item" id="navRuta"><a class="nav-link" href="./ruta.html">Ruta</a></li>

          <!-- login / registro (visibles si NO hay sesión) -->
          <li class="nav-item" id="navLogin"><a class="nav-link" href="./inicio.html">Iniciar Sesión</a></li>
          <li class="nav-item" id="navRegister"><a class="nav-link" href="./registro.html">Registrarse</a></li>

          <!-- perfil / logout (visibles si HAY sesión) -->
          <li class="nav-item dropdown d-none" id="navUserDropdown">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdownLink" role="button"
               data-bs-toggle="dropdown" aria-expanded="false">
              <span id="navUserName">Usuario</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdownLink">
              <li><a class="dropdown-item" id="navPerfil" href="./perfil.html">Perfil</a></li>
              <li><a class="dropdown-item" id="navCerrar" href="#" role="button">Cerrar sesión</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO -->
  <main class="main">
    <section class="login-card form-card">
      <h1>Registro / Análisis de Negocio</h1>
      <form id="formBiz" autocomplete="off" class="form form-long">
        <input id="businessName" type="text" class="form-control" placeholder="Nombre del negocio" required>
        <input id="productType" type="text" class="form-control" placeholder="Tipo de producto / especialidad">
        <input id="channel" type="text" class="form-control" placeholder="Canal principal previsto">

        <div class="row g-2">
          <div class="col-md-6">
            <input id="avgPrice" type="number" class="form-control" placeholder="Precio promedio por unidad (COP)">
          </div>
          <div class="col-md-6">
            <input id="avgCost" type="number" class="form-control" placeholder="Costo promedio por unidad (COP)">
          </div>
        </div>

        <input id="initialInvestment" type="number" class="form-control" placeholder="Inversión inicial estimada (COP)">
        <textarea id="description" rows="3" class="form-control" placeholder="Breve descripción"></textarea>

        <button class="btn btn-primary w-100 mt-3" type="submit">Registrar y analizar</button>
      </form>

      <!-- Resultado del análisis IA -->
      <div id="resultBox" class="result-card mt-4" style="display:none"></div>
    </section>
  </main>

  <!-- JS -->
  <script src="./assets/nav.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/analyze-business.js"></script>
</body>
</html>
