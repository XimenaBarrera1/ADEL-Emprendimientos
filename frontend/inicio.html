<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión - ADEL</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="./assets/navbar.css">
  <link rel="stylesheet" href="./assets/styles2.css">
</head>

<body>

  <!-- coloca esto en la parte superior de cada página (index.html, noticias.html, inicio.html, etc.) -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="./index.html">
      <img src="./assets/imagenes/imagen2.png" alt="Logo ADEL" height="80" class="me-2">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav" id="navList">
        <!-- elementos públicos (si no hay sesión se muestran) -->
        <li class="nav-item" id="navInicio"><a class="nav-link" href="./index.html">Inicio</a></li>
        <li class="nav-item" id="navNoticias"><a class="nav-link" href="./noticias.html">Noticias</a></li>
        <li class="nav-item" id="navMapa"><a class="nav-link" href="./mapa.html">Mapa</a></li>
        <li class="nav-item" id="navRuta"><a class="nav-link" href="./ruta.html">Ruta</a></li>

        <!-- login / registro (visibles si NO hay sesión) -->
        <li class="nav-item" id="navLogin"><a class="nav-link" href="./inicio.html">Iniciar Sesión</a></li>
        <li class="nav-item" id="navRegister"><a class="nav-link" href="./registro.html">Registrarse</a></li>

        <!-- perfil / logout (visibles si HAY sesión) -->
        <li class="nav-item dropdown d-none" id="navUserDropdown">
          <a class="nav-link dropdown-toggle" href="#" id="userDropdownLink" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <span id="navUserName">Usuario</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdownLink">
            <li><a class="dropdown-item" id="navPerfil" href="./perfil.html">Perfil</a></li>
            <li><a class="dropdown-item" id="navCerrar" href="#" role="button">Cerrar sesión</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>


  <!-- Contenido principal -->
  <main class="main">
    <section class="login-card">
      <h1>Inicia sesión en ADEL</h1>

      <form id="loginForm" class="form">
        <input type="email" id="email" placeholder="Correo electrónico" required />
        <input type="password" id="password" placeholder="Contraseña" required />
        <button type="submit" class="btn">Entrar</button>
      </form>

      <div class="links">
        <p>¿No tienes cuenta? 
          <a href="./registro.html" class="register"><em>Regístrate aquí</em></a>
        </p>
      </div>

      <div id="alertMessage" class="alert mt-3 d-none" role="alert"></div>
    </section>
  </main>



  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/nav.js"></script>
<script src="./assets/main.js"></script>

</body>
</html>
